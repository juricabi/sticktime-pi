# On a tag vX.Y.Z (or by hand): the Pi binary, the app package for the updater
# (sticktime-pi-app-<ver>.tar.gz), the SD card image with the newest StickTime release, a boot test
# of that image under QEMU (raspi3b), and on tags a GitHub release with all of it.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      game_version:
        description: "StickTime release to ship (e.g. 1.7.2); empty = the newest"
        required: false
        default: ""
      base:
        description: "base image id from image/base.env; empty = its default"
        required: false
        default: ""
      boot_test:
        description: "boot test under QEMU"
        type: choice
        options: [full, quick, skip]
        default: full

permissions:
  contents: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.15.2

jobs:
  app:
    name: app (aarch64 binary + updater package)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
      label: ${{ steps.ver.outputs.label }}
      next: ${{ steps.bin.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER=${GITHUB_REF_NAME#v}
            LABEL=$VER
          else
            VER=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//' || true)
            VER=${VER:-0.0.0}
            LABEL=$VER-dev.$(git rev-parse --short HEAD)
          fi
          [[ "$VER" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "the tag must be vX.Y.Z (got $VER)"; exit 1; }
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "StickTime Pi $VER ($LABEL)"
      - name: Install zig
        run: |
          curl -fsSL --retry 5 "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
      - name: Build the Pi binary (and a newer one for the boot test's update check)
        id: bin
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          # the update check installs a binary with a higher version from a fake GitHub, then rolls back
          NEXT=$(python3 -c "import sys; p=sys.argv[1].split('.'); p=p+['1'] if len(p)<4 else p[:-1]+[str(int(p[-1])+1)]; print('.'.join(p))" "$VER")
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          VERSION=$NEXT CC="zig cc" host/build.sh aarch64 prog
          mkdir -p next && cp build/aarch64-edgetx/sticktime-pi next/sticktime-pi
          rm -f build/aarch64-edgetx/obj/src/app.o build/aarch64-edgetx/obj/src/main.o   # the version is compiled into these
          VERSION=$VER CC="zig cc" host/build.sh aarch64 prog
          file build/aarch64-edgetx/sticktime-pi | tee /dev/stderr | grep -q 'ARM aarch64.*statically linked'
      - name: Package sticktime-pi-app-${{ steps.ver.outputs.ver }}.tar.gz
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python3 tools/make_app_package.py \
            --bin build/aarch64-edgetx/sticktime-pi --ver "$VER" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            build/aarch64-edgetx/sticktime-pi
            next/sticktime-pi
            dist/*
          if-no-files-found: error

  image:
    name: SD card image + boot test
    needs: app
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      VER: ${{ needs.app.outputs.ver }}
      LABEL: ${{ needs.app.outputs.label }}
      NEXT: ${{ needs.app.outputs.next }}
      WORKDIR: /mnt/sticktime-work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: app, path: app }
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dosfstools e2fsprogs fdisk xz-utils zerofree \
            qemu-system-arm qemu-utils curl python3
          e2fsck -V
          qemu-system-aarch64 --version
          # the runner's second disk has the room (base 0.6 GB, work image 3.2 GB, boot test 4.3 GB)
          sudo mkdir -p "$WORKDIR" && sudo chown "$(id -u):$(id -g)" "$WORKDIR"
          df -h / /mnt
      - name: The StickTime release to ship
        id: game
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.game_version }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, urllib.request
          req = urllib.request.Request("https://api.github.com/repos/juricabi/sticktime/releases?per_page=100",
                                       headers={"Accept": "application/vnd.github+json",
                                                "Authorization": "Bearer " + os.environ["GH_TOKEN"]})
          rels = json.load(urllib.request.urlopen(req, timeout=60))
          want = os.environ.get("WANT", "").strip().lstrip("v")
          best = None
          for r in rels:
              m = re.fullmatch(r"v(\d+(?:\.\d+){1,3})", r.get("tag_name", ""))
              if not m or r.get("draft") or r.get("prerelease"):
                  continue
              ver = m.group(1)
              asset = next((a for a in r.get("assets", []) if a["name"] == f"StickTime-{ver}-sdcard.zip"), None)
              if asset is None or (want and ver != want):
                  continue
              key = tuple(int(x) for x in ver.split("."))
              if best is None or key > best[0]:
                  best = (key, ver, asset)
          if best is None:
              raise SystemExit("no usable StickTime release" + (f" {want}" if want else ""))
          _k, ver, asset = best
          digest = (asset.get("digest") or "").removeprefix("sha256:")
          print(f"version={ver}")
          print(f"sha256={digest}")
          PY
          cat "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: build/image-cache/*.img.xz
          key: pios-${{ hashFiles('image/base.env') }}-${{ inputs.base || 'default' }}
      - name: Build the image
        run: |
          sudo env VER="$VER" LABEL="$LABEL" BASE="${{ inputs.base }}" BIN="$PWD/app/build/aarch64-edgetx/sticktime-pi" \
            GAME_VERSION="${{ steps.game.outputs.version }}" GAME_SHA256="${{ steps.game.outputs.sha256 }}" \
            WORK="$WORKDIR/build" OUT="$PWD/out" SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            bash image/build.sh
          sudo chown -R "$(id -u):$(id -g)" out build/image-cache
          ls -la out
      - name: Boot test (QEMU raspi3b)
        if: inputs.boot_test != 'skip'
        run: |
          python3 image/test/boot_test.py out/sticktime-pi-$LABEL.img.xz --work "$WORKDIR/boot" \
            --update-bin app/next/sticktime-pi --update-ver "$NEXT" \
            ${{ inputs.boot_test == 'quick' && '--quick' || '' }}
      - name: Boot test logs
        if: always() && inputs.boot_test != 'skip'
        run: |
          mkdir -p boot-test
          cp "$WORKDIR"/boot/*.log "$WORKDIR"/boot/report.json "$WORKDIR"/boot/*.png boot-test/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-test
          path: boot-test
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: sticktime-pi-${{ env.LABEL }}
          path: |
            out/*.img.xz
            out/*.img.xz.sha256
            out/*.info
            app/dist/*
          compression-level: 0
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$GITHUB_REF_NAME
          {
            echo "StickTime Pi $VER"
            echo
            echo "Flash \`sticktime-pi-$VER.img.xz\` with Raspberry Pi Imager (\"Use custom\", and **No** to OS customisation)"
            echo "or any other SD card writer, then edit \`sticktime.txt\` on the card's boot partition from a PC."
            echo
            echo '```'
            cat "out/sticktime-pi-$LABEL.info"
            echo '```'
          } > notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "StickTime Pi $VER" --notes-file notes.md
          gh release upload "$TAG" --clobber out/*.img.xz out/*.img.xz.sha256 out/*.info app/dist/*
